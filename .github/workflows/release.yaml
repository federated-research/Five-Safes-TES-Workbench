name: Release

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # required for PyPI trusted publishing

on:
  push:
    branches:
      - main

jobs:
  testing:
    uses: ./.github/workflows/tests.yml

  release:
    uses: health-informatics-uon/workflows/.github/workflows/semantic-release.yml@83cde33d81849fd85749625bf26326a30128e6ce # v 1.6.1
    needs: testing
    with:
      node-version: "24"
    secrets: inherit

  publish-pypi:
    needs: release
    if: needs.release.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/five-safes-tes-workbench
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
