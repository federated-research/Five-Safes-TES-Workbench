name: Release

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # required for PyPI trusted publishing

on:
  push:
    branches:
      - main

jobs:
  testing:
    uses: ./.github/workflows/tests.yml

  release:
    uses: health-informatics-uon/workflows/.github/workflows/semantic-release.yml@e7fef64e059787668f48a5c88a3837e13962a95c # v 1.6.0
    needs: testing
    with:
      node-version: "24"
    secrets: inherit

  publish-pypi:
    needs: release
    if: needs.release.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/five-safes-tes-workbench
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
